<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SIMAPRES UNPATTI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: #1e293b;
        }
        .card {
            max-width: 480px;
            margin: 24px;
            padding: 32px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
            text-align: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 600;
            margin-bottom: 16px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }
        p {
            margin: 0 0 12px;
            line-height: 1.6;
            color: #475569;
        }
        button {
            margin-top: 16px;
            border: none;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Mode Offline</div>
        <h1>Koneksi sedang tidak tersedia</h1>
        <p>Beberapa halaman SIMAPRES masih dapat dibuka dari cache, tetapi aksi yang memerlukan server mungkin belum bisa diproses.</p>
        <p>Silakan periksa koneksi Anda lalu coba lagi. Form yang mendukung pemulihan offline akan tetap tersimpan di browser.</p>
        <button onclick="window.location.reload()">Coba lagi</button>
    </div>
</body>
</html>
