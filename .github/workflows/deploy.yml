name: Deploy to Production

on:
  workflow_run:
    workflows: ["Laravel CI"]
    branches: [ "main" ]
    types:
      - completed

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Memulai proses deployment SIMAPRES..."
            cd /var/www/simapres
            
            # Put app into maintenance mode
            php artisan down --retry=60
            
            # Pull latest code
            git pull origin main
            
            # Install PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Install Node modules & build assets
            npm ci
            npm run build
            
            # Cache optimizations
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan icons:cache
            
            # Database migrations
            php artisan migrate --force
            
            # Clear application cache
            php artisan cache:clear
            
            # Restart Services (Requires NOPASSWD sudo for these specific commands, or run as root/user with auth)
            sudo systemctl restart php8.3-fpm
            sudo supervisorctl restart simapres-worker:*
            
            # Take app out of maintenance mode
            php artisan up
            
            echo "Deployment SIMAPRES selesai!"
